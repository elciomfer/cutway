name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f .gitignore
          echo "Repository baseline check passed."
